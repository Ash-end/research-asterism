<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc"><title id="title">Research decision loop</title><desc id="desc">Question and goal, mechanisms and assumptions, unresolved limit, competing hypotheses, discriminating validation, then an evidence-based decision. Reading and retrieval can loop back.</desc><rect width="1160" height="300" rx="18" fill="#f3f0e8"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5" fill="none" stroke="#437977"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#cbd7cc"><rect x="25" y="60" width="170" height="125" rx="12"/><rect x="215" y="60" width="170" height="125" rx="12"/><rect x="405" y="60" width="170" height="125" rx="12"/><rect x="595" y="60" width="170" height="125" rx="12"/><rect x="785" y="60" width="170" height="125" rx="12"/><rect x="975" y="60" width="160" height="125" rx="12"/></g><g fill="#1c4d50" font-size="16"><text x="110" y="100">01 · QUESTION</text><text x="300" y="100">02 · ASSUMPTIONS</text><text x="490" y="100">03 · LIMIT</text><text x="680" y="100">04 · HYPOTHESES</text><text x="870" y="100">05 · VALIDATION</text><text x="1055" y="100">06 · DECISION</text></g><g fill="#263e43" font-size="15"><text x="110" y="138">Object and goal</text><text x="300" y="138">Mechanisms</text><text x="490" y="138">Specific mismatch</text><text x="680" y="138">Competing predictions</text><text x="870" y="138">Discriminating check</text><text x="1055" y="138">Scope and next step</text></g><g stroke="#437977" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M195 122h17M385 122h17M575 122h17M765 122h17M955 122h17"/><path d="M1055 185v45H110v-40"/></g><text x="580" y="267" fill="#476365" font-size="16">Read, retrieve, reason and revise as evidence changes the question.</text></g></svg>
