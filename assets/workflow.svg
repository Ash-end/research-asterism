<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-labelledby="title desc"><title id="title">From field learning to method construction</title><desc id="desc">Preparation and eight iterative steps. More reading returns to understanding; test feedback revisits causes or requirements. Enter locally when appropriate.</desc><rect width="960" height="655" rx="20" fill="#102b35"/><g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="48" font-size="15" fill="#9ccfc1">LEARN → UNDERSTAND → CONSTRUCT</text><rect x="45" y="78" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="65" y="110" font-size="13" fill="#9ccfc1">PREP</text><text x="65" y="153" font-size="19" fill="#fbfaf5">Batch orientation</text><path d="M319 138h19m-6-6 6 6-6 6" stroke="#80b9af" fill="none"/><rect x="345" y="78" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="365" y="110" font-size="13" fill="#9ccfc1">1</text><text x="365" y="153" font-size="19" fill="#fbfaf5">Families + chronology</text><path d="M619 138h19m-6-6 6 6-6 6" stroke="#80b9af" fill="none"/><rect x="645" y="78" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="665" y="110" font-size="13" fill="#9ccfc1">2</text><text x="665" y="153" font-size="19" fill="#fbfaf5">Productive reading</text><rect x="45" y="232" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="65" y="264" font-size="13" fill="#9ccfc1">3</text><text x="65" y="307" font-size="19" fill="#fbfaf5">Explain + correct</text><path d="M319 292h19m-6-6 6 6-6 6" stroke="#80b9af" fill="none"/><rect x="345" y="232" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="365" y="264" font-size="13" fill="#9ccfc1">4</text><text x="365" y="307" font-size="19" fill="#fbfaf5">Summarize one family</text><path d="M619 292h19m-6-6 6 6-6 6" stroke="#80b9af" fill="none"/><rect x="645" y="232" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="665" y="264" font-size="13" fill="#9ccfc1">5</text><text x="665" y="307" font-size="19" fill="#fbfaf5">Refine + retrieve</text><rect x="45" y="386" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="65" y="418" font-size="13" fill="#9ccfc1">6</text><text x="65" y="461" font-size="19" fill="#fbfaf5">Properties vs needs</text><path d="M319 446h19m-6-6 6 6-6 6" stroke="#80b9af" fill="none"/><rect x="345" y="386" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="365" y="418" font-size="13" fill="#9ccfc1">7</text><text x="365" y="461" font-size="19" fill="#fbfaf5">Trace causes</text><path d="M619 446h19m-6-6 6 6-6 6" stroke="#80b9af" fill="none"/><rect x="645" y="386" width="270" height="120" rx="10" fill="#183b42" stroke="#80b9af"/><text x="665" y="418" font-size="13" fill="#9ccfc1">8</text><text x="665" y="461" font-size="19" fill="#fbfaf5">Construct + test</text><text x="45" y="560" fill="#dfe9de" font-size="17">Read another family: 4 → 2 · New material: 5 → 3</text><text x="45" y="593" fill="#dfe9de" font-size="17">Test feedback: 8 → 7 or 6 · Existing project: enter locally</text><text x="45" y="626" fill="#9ccfc1" font-size="13">Original synthesis · Evidence calibrates and advances construction</text></g></svg>
